<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" role="img" aria-labelledby="title desc"><title id="title">learn-pi architecture</title><desc id="desc">A human controls the CLI. The CLI creates a real Pi session. Extensions intercept calls and connect policy, durable state, MCP, and read-only child sessions. All share a host unless enclosed in a container.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#087f73"/></marker></defs><rect width="920" height="450" fill="#faf8f2"/><g font-family="Georgia,serif" fill="#24322f"><text x="28" y="35" font-size="20">ONE RUNTIME, EXPLICIT BOUNDARIES</text></g><rect x="24" y="59" width="872" height="370" rx="4" fill="#f0ede4" stroke="#b6c3b7" stroke-dasharray="6 5"/><text x="46" y="87" font-family="monospace" font-size="11" fill="#54635d">HOST PROCESS / FILESYSTEM — NOT AN OS SANDBOX</text><g font-family="monospace" font-size="14" fill="#24322f" text-anchor="middle"><rect x="52" y="113" width="165" height="67" fill="#fffdf6" stroke="#bec8bc"/><text x="134" y="140">Human + CLI</text><text x="134" y="162" font-size="11">mode · approvals</text><rect x="279" y="113" width="278" height="67" fill="#087f73"/><text x="418" y="140" fill="#fffdf6">Real Pi AgentSession</text><text x="418" y="162" font-size="11" fill="#d1eee3">model ↔ tools ↔ results</text><rect x="622" y="113" width="248" height="67" fill="#fffdf6" stroke="#bec8bc"/><text x="746" y="140">Course extension</text><text x="746" y="162" font-size="11">tool_call · tools · commands</text><g stroke="#087f73" fill="none" marker-end="url(#arrow)"><path d="M217 147H271"/><path d="M557 147H614"/><path d="M747 180V217H153V247"/><path d="M747 217H365V247"/><path d="M747 217H579V247"/><path d="M747 217H787V247"/></g><g fill="#fffdf6" stroke="#bec8bc"><rect x="52" y="256" width="194" height="85"/><rect x="265" y="256" width="194" height="85"/><rect x="478" y="256" width="194" height="85"/><rect x="691" y="256" width="179" height="85"/></g><text x="149" y="285">Policy</text><text x="149" y="309" font-size="10">mode → path → approval</text><text x="362" y="285">Durable state</text><text x="362" y="309" font-size="10">tasks · audit · snapshots</text><text x="575" y="285">Local MCP</text><text x="575" y="309" font-size="10">stdio · fixed catalog</text><text x="780" y="285">Child sessions</text><text x="780" y="309" font-size="10">read / ls · max 2</text></g><path d="M52 368H870" stroke="#c5cbbf"/><text x="52" y="394" font-family="monospace" font-size="11" fill="#9c512d">OPTIONAL CONTAINER: enclose the whole process, restrict mounts and network.</text></svg>
